name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    container: node:24-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cinema_ticketing_ci
          POSTGRES_USER: cinema_ci
          POSTGRES_PASSWORD: ci_only_password
        options: >-
          --health-cmd "pg_isready -U cinema_ci -d cinema_ticketing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql://cinema_ci:ci_only_password@postgres:5432/cinema_ticketing_ci
      RUN_POSTGRES_INTEGRATION: "true"
      LOG_LEVEL: silent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check syntax
        run: npm run check

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests with PostgreSQL integration enabled
        run: npm test -- --test-concurrency=1

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build --tag "cinema-ticketing-api:${GITHUB_SHA}" .
